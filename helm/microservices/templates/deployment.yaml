{{- range $name, $service := .Values.services }}
{{- if and (eq $name "gateway") $.Values.blueGreen.enabled }}
{{- /* Gateway se despliega en templates/gateway-blue-green.yaml */ -}}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: cloudcomputingdevops
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $service.port }}
          env:
            - name: PORT
              value: {{ $service.port | quote }}
            {{- range $key, $value := $service.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $service.secretName }}
          envFrom:
            - secretRef:
                name: {{ $service.secretName }}
          {{- end }}
          {{- with $.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
