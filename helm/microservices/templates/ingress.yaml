{{- if and .Values.ingress.enabled .Values.blueGreen.enabled }}
{{- $gateway := index .Values.services "gateway" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: cloudcomputingdevops
    app.kubernetes.io/component: blue-green
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ $gateway.port }}
{{- end }}
