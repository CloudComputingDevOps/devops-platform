{{- range $name, $service := .Values.services }}
{{- if $service.http }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- if and (eq $name "gateway") $.Values.blueGreen.enabled }}
    bluegreen.active: {{ $.Values.blueGreen.activeColor | quote }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
    {{- if and (eq $name "gateway") $.Values.blueGreen.enabled }}
    version: {{ $.Values.blueGreen.activeColor }}
    {{- end }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: {{ $service.port }}
      protocol: TCP
{{- end }}
{{- end }}
