replicaCount: 1

# Límites para que la alerta PodCPUAlto (CPU > 80%) pueda evaluarse (R1.6).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Blue-green (R1.7): dos slots del Gateway + Ingress.
# El Service "gateway" apunta solo al color activo (activeColor).
blueGreen:
  enabled: true
  activeColor: blue
  blue:
    tag: sha-d712b92
    replicas: 1
  green:
    # Misma imagen al inicio; cambia el tag para demostrar el switch.
    tag: sha-d712b92
    replicas: 1

ingress:
  enabled: true
  className: nginx
  host: gateway.local
  annotations: {}

services:
  gateway:
    image:
      repository: ghcr.io/cloudcomputingdevops/gateway
      tag: sha-d712b92
    port: 3000
    http: true
    secretName: ""
    env:
      NATS_SERVERS: "nats://nats:4222"

  administrative-data:
    image:
      repository: ghcr.io/cloudcomputingdevops/administrative-data-microservice
      tag: sha-57cd697
    port: 3001
    http: false
    secretName: administrative-data-secrets
    env:
      NATS_SERVERS: "nats://nats:4222"
      CLOUDINARY_NAME: "dq8fxqzch"
      EMAIL_FROM: "Talentcore"
      EMAIL_FROM_ADDRESS: "notificaciones@devcorebits.com"

  users:
    image:
      repository: ghcr.io/cloudcomputingdevops/users-microservice
      tag: sha-5ac9c40
    port: 3003
    http: false
    secretName: users-secrets
    env:
      CLOUDINARY_NAME: "dq8fxqzch"
      NATS_SERVERS: "nats://nats:4222"
      SUPABASE_URL: "https://juaxululyelhiwfjsadc.supabase.co"
      REDIRECT_URL: "http://localhost:5173/signup"
      # DATABASE_KEY, CLOUDINARY_API_KEY y CLOUDINARY_API_SECRET van en el Secret users-secrets

  trajectory:
    image:
      repository: ghcr.io/cloudcomputingdevops/trajectory-microservice
      tag: sha-e2ba8e8
    port: 3002
    http: false
    secretName: trajectory-secrets
    env:
      NATS_SERVERS: "nats://nats:4222"
