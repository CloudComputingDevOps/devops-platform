# Exportador de metricas del pipeline CI (GitHub Actions).
# El codigo (exporter.py) se monta desde el ConfigMap "pipeline-exporter-code",
# que crea scripts/install-monitoring.sh a partir del archivo del repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-exporter
  namespace: monitoring
  labels:
    app: pipeline-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-exporter
  template:
    metadata:
      labels:
        app: pipeline-exporter
    spec:
      containers:
        - name: exporter
          image: python:3.12-alpine
          command: ["python", "-u", "/app/exporter.py"]
          ports:
            - name: metrics
              containerPort: 9101
          env:
            - name: GITHUB_ORG
              value: CloudComputingDevOps
            - name: GITHUB_REPOS
              value: Gateway,Users-Microservice,Administrative-Data-Microservice,Trajectory-Microservice,Frontend
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  optional: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: pipeline-exporter-code
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-exporter
  namespace: monitoring
  labels:
    app: pipeline-exporter
spec:
  selector:
    app: pipeline-exporter
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pipeline-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: pipeline-exporter
  endpoints:
    - port: metrics
      interval: 30s
